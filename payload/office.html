    // 경고 뱃지는 가장 많이 찬 창 기준 (Codex처럼 7일 한도만 있는 경우도 잡히게)
    const [wk, L] = [["five_hour", "5시간"], ["seven_day", "7일"]].map(([k, lbl]) => [lbl, a.limits?.[k]])
      .filter(([, w]) => w && w.used != null).sort((x, y) => y[1].used - x[1].used)[0] || [];
    const hot = L && L.used >= 80 ? `<span class="hot" title="${resetIn(L.resets)}">한도 ${L.used}%</span>` : "";
    return `<div class="agent">
      <div class="top">
        <div class="avatar" style="background:var(--${n}-soft);color:var(--${n})">${{claude: "CL", codex: "CX"}[n]}</div>
        <div class="meta">
          <div class="name">${NAME[n]}${a.model ? `<span class="model" title="${esc(a.model)}">${esc(String(a.model).replace(/^claude-/, ""))}</span>` : ""}</div>
          <div class="st ${a.status === "working" ? "now" : ""}" title="${esc(doing || heldTip)}"><span class="dot ${a.status}" style="${a.status === "working" ? `background:var(--${n})` : ""}"></span><span class="what">${
            a.status === "working" ? esc(doing || "작업 중") + (a.paused ? " · 끝나면 멈춤" : "") : heldText ? esc(heldText) : (STATUS[a.status] ?? a.status)}</span></div></div>
        <div class="ctl">${hot}
        <button class="ghost" ${a.status === "idle" && !a.paused ? "hidden" : ""} title="${a.paused ? "다시 시작" : a.status === "working" ? "이번 차례 끝나면 멈춤" : "잠시 멈춤"}" aria-label="${a.paused ? "다시 시작" : "잠시 멈춤"}" onclick='this.disabled=true;api({action:"pause",agent:"${n}",paused:${!a.paused}})'>${icon(a.paused ? "start" : "pause", "sm")}</button>
        ${a.status === "working" && !a.paused ? `<button class="ghost" aria-label="중단" title="지금 바로 멈춤" onclick='if(confirm("${NAME[n]}의 지금 차례를 바로 끊을까요?\\n이미 고친 파일은 그대로 남고, [다시 시작]하면 이어서 합니다.")){this.disabled=true;api({action:"pause_now",agent:"${n}"})}'>${icon("x", "sm")}</button>` : ""}</div>
      </div>
      ${a.error ? (h => `<div class="agerr">${icon("alert", "sm")}<div><b>${h.title}</b>${a.fail_count > 1 ? ` (같은 오류 ${a.fail_count}번째)` : ""}
          <div class="how">${esc(h.how(n, a))}</div>
          <details class="raw"><summary>원문 보기</summary><code>${esc(friendlyErr(a.error))}</code></details></div></div>`)(errHelp(n, a)) : ""}
      ${a.notice && !a.error ? (([h, d]) => `<div class="agnote"><b>${esc(h)}</b>${d ? `<div class="how">${esc(d)}</div>` : ""}</div>`)(splitMsg(a.notice)) : ""}
      ${a.status === "working" ? `<div class="pulse" hidden data-last="${esc(a.activity?.at(-1)?.ts || "")}" data-since="${a.since}"></div>` : ""}
      ${(a.subs || []).length ? `<details class="fold subs" data-a="sub-${n}" ${openAgent.has("sub-" + n) ? "open" : ""}>
        <summary>${icon("chevron", "sm")}<span class="subchip">보조 ${a.subs.length}개 돌리는 중</span></summary>
        ${a.subs.map(x => `<div class="subrow"><span class="dot working" style="background:var(--${n})"></span><span class="tx">${esc(x.desc || "보조 작업")}</span><span class="ts" data-since="${x.since}">${elapsed(x.since)}</span></div>`).join("")}</details>` : ""}
      ${last ? `<div class="feed now">${last}</div>` : ""}
      <details class="fold more-info" data-a="${n}" ${openAgent.has(n) ? "open" : ""}><summary>${icon("chevron", "sm")}활동 기록 · 사용량</summary>
        ${usageBlock(n, a)}
        <div class="feed" id="feed-${n}">${rows || '<div class="empty">아직 활동이 없습니다.</div>'}</div></details>
    </div>`;
  }).join("");
  Object.keys(agents).forEach(n => { const f = $("#feed-" + n); f.scrollTop = keep[f.id] ?? f.scrollHeight; });
  document.querySelectorAll("#agents details[data-more]").forEach(d => d.ontoggle = () =>
    d.open ? openMore.add(d.dataset.more) : openMore.delete(d.dataset.more));
  document.querySelectorAll("#agents details[data-a]").forEach(d => d.ontoggle = () => {
    d.open ? openAgent.add(d.dataset.a) : openAgent.delete(d.dataset.a);
  });
}

// 가벼운 마크다운: **굵게**, `코드`, "- " 목록. 나머지는 줄바꿈 그대로
// 줄 단위로: # 제목, - 목록, 1. 번호목록, > 인용, 빈 줄은 문단 간격. 원문 줄바꿈은 그대로 두고 임의로 쪼개지 않음
// 셸 인자로 넘어오며 줄바꿈이 글자 그대로 '\n'이 된 보고(예: office finish "...\n- ...")를 진짜 줄바꿈으로
// 진짜 줄바꿈이 하나도 없고 '\n- ' 같은 보고 목록 꼴일 때만 바꿈 (코드 속 글자 '\n'은 그대로 둠)
const unescNl = s => { s = String(s ?? ""); return !s.includes("\n") && /\\n(\\n)?\s*[-•*]\s/.test(s) ? s.replace(/\\n/g, "\n") : s; };
function md(s, lead) {
  const inline = t => t.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  const lines = esc(String(s ?? "").trim()).split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const fence = lines[i].match(/^ {0,3}(`{3,})([^`]*)$/);
    if (fence) {
      const code = [];
      const close = new RegExp("^ {0,3}`{" + fence[1].length + ",}\\s*$");
      while (++i < lines.length && !close.test(lines[i])) code.push(lines[i]);
      const language = fence[2].trim();
      out.push(`<div class="code-shell"><div class="code-toolbar"><span class="code-lang">${language || "코드"}</span><button class="copy-code" aria-label="코드 복사" onclick="copyCode(this)">복사</button></div><pre class="codeblock"><code>${code.join("\n")}</code></pre></div>`);
      continue;
    }
    const l = lines[i];
    out.push((() => {
    let m;
    if (lead && i === 0) return `<div class="lead1">${inline(l)}</div>`;
    if (!l.trim()) return '<div class="gap"></div>';
    if ((m = l.match(/^#{1,3}\s+(.*)/)) || (m = l.match(/^\*\*([^*]+)\*\*:?$/))) return `<div class="h">${inline(m[1])}</div>`;
    if ((m = l.match(/^\s*[-•*]\s+(.*)/))) return `<div class="li">${inline(m[1])}</div>`;
    if ((m = l.match(/^\s*(\d+[.)]|[①-⑳])\s+(.*)/))) return `<div class="li num"><span class="n">${m[1]}</span>${inline(m[2])}</div>`;
    if ((m = l.match(/^&gt;\s?(.*)/))) return `<div class="quote">${inline(m[1])}</div>`;
    return `<div class="p">${inline(l)}</div>`;
    })());
  }
  return out.join("");
}
// 요청현황용 한 줄 요약: 서버가 준 brief → 없으면 보고 첫 줄
const firstLine = s => String(s ?? "").replace(/[*`#>]/g, "").split("\n").map(x => x.trim()).find(Boolean) || "";
const briefOf = j => firstLine(j.brief || j.summary);
const fold = (key, summary, body, cls = "") => `<details class="fold ${cls}" data-k="${key}" ${openTurns.has(key) ? "open" : ""}>
  <summary>${icon("chevron", "sm")}${summary}</summary>${body}</details>`;

// 사용자 알림의 링크는 먼저 HTML 문자를 이스케이프한 뒤 https 주소만 링크로 만든다.
const noticeLinks = s => esc(s).replace(/https:\/\/(?:(?!&(?:quot|#39|lt|gt);)[^\s<])+/g,
  url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);

function msgHtml(m, compact) {
  if (m.kind === "event") {
    const alert = m.to === "user";
    const who = m.from === "system" ? "" : `<b>${tag(m.from)}</b>`;
    if (alert) {   // 경고는 '제목 — 상세'를 두 줄로: 문구가 길어져도 가운데 정렬로 들쭉날쭉 깨지지 않게
      const [head, detail] = splitMsg(m.text);
      const success = /로그인 (?:완료|성공)$/.test(head.trim());
      return `<div class="event ${m.from} alert${success ? " success" : ""}">${icon(success ? "done" : "alert", "sm")}<div class="ev-body">${who}<span class="ev-head">${noticeLinks(head)}</span>${detail ? `<span class="ev-detail">${noticeLinks(detail)}</span>` : ""}</div><span class="ts">${esc(when(m))}</span></div>`;
    }
    return `<div class="event ${m.from}">${who}${esc(m.text)}<span>· ${esc(when(m))}</span></div>`;
  }
  if (m.kind === "turn") {
    if (m.job != null) return fold("t" + m.id, `${NAME[m.from]} 작업 기록 · ${esc(when(m))}`, `<pre>${esc(m.text)}</pre>`, "turn");
    // 단독 대화의 답변은 클릭 없이 본문으로 표시한다. 기존 기록에도 적용.
    m = {...m, kind: "msg", to: "user", job: null};
  }
  const to = m.to === "all" ? "" : `<span class="arrow">→</span>${tag(m.to)}`;
  // 결과 카드는 kind=report만. job 필드 없는 예전 기록은 에이전트→사용자 메시지를 보고로 추정
  const report = m.kind === "report" || (!("job" in m) && m.from !== "user" && m.to === "user");
  const ask = !report && m.from !== "user" && m.to === "user";
  return `<div class="msg ${m.from} ${report ? "report" : ask ? "toUser" : ""} ${compact ? "compact" : ""}"><div class="who">${tag(m.from)}${to}${report ? '<span class="pill">결과 보고</span>' : ""}<span class="ts">${esc(when(m))}</span></div><div class="body">${(t => md(t, report && t.includes("\n")))(report ? unescNl(m.text) : m.text)}</div></div>`;
}

// 대화창을 요청 단위로 묶음: 요청 → (진행 과정은 접어둠) → 결과 보고
// 메시지에 job이 없으면(예전 기록) 요청 순서·"요청 N" 이벤트로 추정
function threads(msgs, jobs) {
  const items = [], byJob = {};
  let reqN = 0, cur = null, chat = false;   // chat: 직전 요청 뒤에 단독 대화(사용자 직접 메시지)가 시작됐는지
  for (let m of msgs) {
    // 한 명에게 보낸 사용자 메시지는 진행 중 요청 번호가 붙어 있어도 접지 않고 본문으로 표시(기존 기록 포함)
    const direct = m.from === "user" && m.kind === "msg" && m.to !== "all";
    let j = direct ? null : m.job;
    if (m.kind === "request") { j ??= jobs[reqN]?.id; reqN++; }
    j ??= +(m.kind === "event" && m.text.match(/^요청 (\d+) /)?.[1]) || null;
    // 직전 요청에 붙이는 추정은 job 필드 자체가 없는 예전 기록만. 명시적 job:null은 단독 대화로 둔다
    if (j == null && !("job" in m) && !(m.from === "user" && m.kind === "msg") && m.kind !== "turn") j = cur;
    // 요청이 끝난 뒤 남은 뒷정리(재시작으로 다시 돈 차례의 안내·에이전트끼리 메시지·혼잣말)는 단독 대화가 아니면 직전 요청 진행 과정으로 접음
    if (j == null && cur != null && !chat && m.from !== "user" && m.re == null && m.kind !== "request") { j = cur; m = {...m, tail: true}; }
    if (m.kind === "request") { cur = j; chat = false; }
    if (direct) chat = true;
    if (j == null) { items.push({m}); continue; }
    if (!byJob[j]) items.push(byJob[j] = {job: jobs.find(x => x.id === j) || {id: j}, req: null, steps: [], reports: []});
    const t = byJob[j];
    if (m.kind === "request" && !t.req) t.req = m;
    else if (m.tail) t.steps.push(m);
    else if (m.kind === "report" || (m.kind === "msg" && m.from !== "user" && m.to === "user") || (m.kind === "event" && m.to === "user")) t.reports.push(m);
    else t.steps.push(m);
  }
  // 단독 대화의 답장(re=답한 사용자 메시지 id)은 시간순 대신 그 질문 바로 아래(앞선 답장 뒤)로 옮긴다
  const replies = items.filter(x => x.m?.re != null && items.some(y => y.m && y.m.id === x.m.re && y.m.from === "user"));
  for (const x of replies) {
    items.splice(items.indexOf(x), 1);
    let at = items.findIndex(y => y.m?.id === x.m.re) + 1;
    while (at < items.length && items[at].m?.re === x.m.re) at++;
    items.splice(at, 0, x);
  }
  return items;
}

function threadHtml(t) {
  // 지나간 경고(예: 'Codex 일시정지')는 그 에이전트가 이후에 다시 움직였으면 해결된 것 → 결과 자리에서 빼서 진행 과정으로 접음
  const all = [...t.steps, ...t.reports];
  // '파일 대기 중 — 파일명…' 경고는 같은 파일의 '파일 예약 풀림 — 파일명…' 알림이 뒤에 오면 해결
  const waitFile = (m, head) => m.kind === "event" && m.to === "user" && m.text.startsWith(head) && m.text.slice(head.length).match(/^(\S+?)(?:을|를)?(?:\s|$)/)?.[1];
  const resolved = m => m.kind === "event" && m.to === "user" && (() => {
    if (m.resolved) return true;   // 서버가 해결 표시한 경고(예: 예약 해제된 파일 대기)
    const file = waitFile(m, "파일 대기 중 — ");
    if (file) return all.some(x => x.id > m.id && waitFile(x, "파일 예약 풀림 — ") === file);
    const who = ["claude", "codex"].find(n => m.text.startsWith(NAME[n]));
    return who && all.some(x => x.from === who && x.id > m.id);
  })();
  t = {...t, steps: [...t.steps, ...t.reports.filter(resolved)].sort((a, b) => a.id - b.id), reports: t.reports.filter(m => !resolved(m))};
  const j = t.job, st = j.cancelled ? "취소됨" : JOBST[j.status] ?? "";
  const live = j.status && j.status !== "done";
  const req = t.req ? `<div class="msg user"><div class="who">나<span class="pill">요청 ${j.id}</span><span class="ts">${esc(when(t.req))}</span></div><div class="body">${md(t.req.text)}</div></div>` : "";
  const steps = t.steps.filter(m => !(m.kind === "event" && /^요청 \d+ (접수|완료)/.test(m.text)));
  const sum = `<span class="pill ${j.status || ""}">${st}</span>${j.lead ? `리더 ${nm(j.lead)}${j.acting_lead ? ` (멈춰서 ${nm(j.acting_lead)} 대행 중)` : ""} · ` : ""}진행 과정 ${steps.length}건${live ? '<span class="dot working"></span>' : ""}`;
  // 진행 중이면 가운데에서 바로: 누가 뭘 하는지·걸린 시간(매초 updateLiveBars가 채움) + 글자 있는 취소 버튼
  const bar = live ? `<div class="livebar" data-job="${j.id}" data-since="${t.req?._at || ""}"><span class="stage"></span><span class="lb-text">진행 중</span>
      <button class="ghost cancel" onclick='cancelJob(${j.id})'>${icon("x", "sm")}요청 취소</button></div>` : "";
  return `<div class="thread ${live ? "live" : ""} ${j.cancelled ? "cancelled" : ""}" id="th-${j.id}">${req}${bar}
    ${steps.length ? fold("j" + j.id, sum, `<div class="steps">${steps.map(m => msgHtml(m, true)).join("")}</div>`, "progress") : ""}
    ${t.reports.map(m => msgHtml(m)).join("")}
    ${j.status === "done" && !j.cancelled && j.summary && !t.reports.some(m => m.kind === "report" || !("job" in m) && m.kind === "msg")
      ? msgHtml({kind: "report", from: j.finished_by || j.acting_lead || j.lead || "system", to: "user", text: j.summary, ts: ""}) : ""}</div>`;
}

function renderTimeline(msgs, jobs) {
  const tl = $("#timeline"), sec = tl.parentElement;
  const stick = forceBottom || sec.scrollHeight - sec.scrollTop - sec.clientHeight < 40;
  forceBottom = false;
  // 위쪽을 읽던 중이면, 보던 요청 묶음이 다시 그린 뒤에도 같은 위치에 오게 기억 (위 요청이 접혀도 화면이 안 튀게)
  const anchor = stick ? null : [...tl.querySelectorAll(".thread[id]")].find(el => el.getBoundingClientRect().bottom > sec.getBoundingClientRect().top);
  const anchorId = anchor?.id, anchorTop = anchor?.getBoundingClientRect().top;
  // 끝난 요청이 쌓이면 최근 KEEP개만 펼치고, 그 이전은 맨 위 '이전 요청 N건'에 한 줄씩 압축 (눌러서 개별로 펼침)
  const items = threads(msgs, jobs), KEEP = 5;
  const tIdx = items.map((x, i) => x.m ? -1 : i).filter(i => i >= 0);
  const cut = tIdx.length > KEEP ? tIdx[tIdx.length - KEEP] : 0;
  const old = items.slice(0, cut).filter(x => !x.m && x.job.status === "done");
  const rest = items.slice(0, cut).filter(x => !x.m && x.job.status !== "done").concat(items.slice(cut));
  const oldRow = x => expandedOld.has(x.job.id) ? threadHtml(x)
    : `<div class="oldrow" role="button" tabindex="0" onclick="expandedOld.add(${x.job.id});lastSig='';refresh()">
        <span class="no">${x.job.id}</span><span class="q">${esc(firstLine(x.req?.text || x.job.text))}</span>
        ${briefOf(x.job) ? `<span class="a">→ ${esc(briefOf(x.job))}</span>` : ""}</div>`;
  const oldBlock = old.length ? fold("old", `이전 요청 ${old.length}건`, `<div class="oldlist">${old.map(oldRow).join("")}</div>`, "older") : "";
  const empty = !items.length;
  tl.classList.toggle("empty-timeline", empty);
  tl.innerHTML = empty ? '<div class="empty-conversation">대화가 없어요</div>' : oldBlock + rest.map(x => x.m ? msgHtml(x.m) : threadHtml(x)).join("");
  tl.querySelectorAll("details.fold").forEach(d => d.ontoggle = () => {
    d.open ? openTurns.add(d.dataset.k) : openTurns.delete(d.dataset.k);
  });
  if (stick) sec.scrollTop = sec.scrollHeight;
  else {
    const again = anchorId && document.getElementById(anchorId);
    if (again) sec.scrollTop += again.getBoundingClientRect().top - anchorTop;
    if (msgs.length > lastMsgs && lastMsgs) $("#toBottom").classList.add("new");
  }
  lastMsgs = msgs.length;
  onTimelineScroll();
}
function onTimelineScroll() {
  const sec = $("#timeline").parentElement, atBottom = sec.scrollHeight - sec.scrollTop - sec.clientHeight < 40;
  $("#toBottom").hidden = atBottom;
  if (atBottom) $("#toBottom").classList.remove("new");
}

// 파일 수정 담당(서버 file_reservations): 같은 파일은 한 명만 고치고 나머지는 읽기·검수만. 예약 있을 때만 접힌 한 줄
let openResv = false;
function resvHtml(list, cur) {
  if (!list?.length) return "";
  const title = id => window._sessions?.find(x => x.id === id)?.title || "다른 대화";
  const row = r => `<div class="resv" title="${esc(r.path)}"><span class="pill ${r.owner || ""}">${nm(r.owner)}</span><code>${esc(r.path.split("/").pop())}</code>
    <span class="muted">${r.session === cur ? (r.job ? `요청 ${r.job}` : "") : esc(title(r.session))}${r.since ? ` · ${elapsed(r.since)}` : ""}</span></div>`;
  const mine = list.filter(r => r.session === cur), other = list.filter(r => r.session !== cur);
  return `<details class="resvs" ${openResv ? "open" : ""} ontoggle="openResv=this.open"><summary>${icon("chevron", "sm")}수정 중인 파일 ${list.length}개${other.length ? ` (다른 대화 ${other.length})` : ""}</summary>
    <div class="resvhint">파일마다 고치는 쪽은 한 명. 다른 쪽은 끝날 때까지 기다리거나 읽고 검수만 함</div>
    ${mine.map(row).join("")}${other.length ? `<div class="resvsub">다른 대화</div>${other.map(row).join("")}` : ""}</details>`;
}
function renderBoard(jobs, tasks, resv = [], cur = "") {
  // 작업 번호는 '요청번호-순번'(3-1)으로: '요청 3'과 '작업 #3'이 헷갈리던 문제. 원래 번호는 툴팁에
  const taskRow = (t, i) => `<div class="task ${t.status}">${icon(t.status)}
    <span class="ti"><span class="t" title="작업 #${t.id} · ${esc(t.title)}"><span class="tno">${t.job ? `${t.job}-${i + 1}` : `#${t.id}`}</span> ${esc(t.title)}</span>${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</span>
    <span class="pill ${t.owner || ""}">${t.owner ? nm(t.owner) : "미배정"}</span></div>`;
  const orphan = tasks.filter(t => !t.job);
  // 진행 중인 요청만 카드로. 끝난 건 접어둔 한 줄 목록 (결과 보고는 대화창에 이미 있음)
  // 마감된 요청이라도 남은 작업이 있으면 진행 중으로 보여줌 (마감 뒤 추가된 후속 작업이 숨지 않게)
  const pending = j => tasks.some(t => t.job === j.id && t.status !== "done");
  const isOpen = j => j.status !== "done" || pending(j);
  const active = jobs.filter(isOpen), closed = jobs.filter(j => !isOpen(j)).reverse();
  const html = [...active].reverse().map(j => {
    const st = j.cancelled ? "취소됨" : JOBST[j.status] ?? j.status;
    const jt = tasks.filter(t => t.job === j.id);
    return `<div class="job ${j.status === "done" ? "closed" : ""}">
      <div class="hd"><span class="tx jump" role="button" tabindex="0" title="${esc(j.text)}" onclick="jumpTo(${j.id})">${esc(j.text)}</span><span class="pill ${j.status}">${st}</span>
        ${j.status !== "done" ? `<button class="ghost" aria-label="요청 취소" onclick='cancelJob(${j.id})'>${icon("x", "sm")}</button>` : ""}</div>
      <div class="sub">요청 ${j.id} · 리더 ${nm(j.lead)}${j.acting_lead ? ` → ${nm(j.acting_lead)} 대행` : ""} · 작업 ${jt.filter(t => t.status === "done").length}/${jt.length}</div>
      ${jt.map(taskRow).join("")}
    </div>`;
  }).join("") + (orphan.filter(t => t.status !== "done").length ? `<div class="job"><div class="hd"><span class="tx">개별 작업</span></div>${orphan.filter(t => t.status !== "done").map(taskRow).join("")}</div>` : "");
  // 끝난 요청: 최근 5건은 '요청 한 줄 + ↳ 답변 한 줄'로 펼쳐 보여주고, 나머지는 접음. 누르면 대화창의 그 요청으로 이동
  const drow = j => `<div class="djob" role="button" tabindex="0" onclick="jumpTo(${j.id})">
      <div class="q"><span class="no">${j.id}</span><span>${esc(firstLine(j.text))}</span>${j.cancelled ? '<span class="pill">취소됨</span>' : ""}</div>
      ${briefOf(j) ? `<div class="a">↳ ${esc(briefOf(j))}</div>` : ""}</div>`;
  const done = closed.length ? `<h2 class="donehd">끝난 요청</h2>${closed.slice(0, 5).map(drow).join("")}
      ${closed.length > 5 ? `<details class="donejobs" ${openDone ? "open" : ""} ontoggle="openDone=this.open"><summary>${icon("chevron", "sm")}이전 요청 ${closed.length - 5}건</summary>${closed.slice(5).map(drow).join("")}</details>` : ""}` : "";
  $("#board").innerHTML = resvHtml(resv, cur) + (html || '<div class="empty">진행 중인 요청이 없습니다.</div>') + done;
}
// 'HH:MM:SS'(오늘) → 지금으로부터 몇 초 전
// 서버(WSL)와 브라우저(Windows) 시계가 몇 초 어긋나 막 찍힌 시각이 '미래'로 보이면 0으로 봄. 자정 넘김만 전날로 처리
function secsAgo(hms) {
  if (!/^\d{2}:\d{2}:\d{2}$/.test(String(hms || ""))) return null;
  const [h, m, s] = String(hms || "").split(":").map(Number);
  if (h > 23 || m > 59 || s > 59) return null;
  const now = new Date(), t = new Date(now); t.setHours(h, m, s || 0, 0);
  let d = (now - t) / 1000;
  if (d < -43200) d += 86400; else if (d < 0) d = 0;

}
// 일하는 중인 에이전트의 '살아있음' 표시: 마지막 움직임이 2분 넘게 없으면 회색 경고
// 마지막 움직임까지 몇 초: 이번 차례 시작(since) 전의 옛 활동은 무시 (그대로 쓰면 '1분 작업 중 · 94초 전'처럼 어긋남)
const quietSecs = (ts, since) => Math.min(secsAgo(ts) ?? Infinity, Math.max(0, Date.now() / 1000 - since));
const dur = d => d < 60 ? `${Math.floor(d)}초` : d < 3600 ? `${Math.floor(d / 60)}분` : `${Math.floor(d / 3600)}시간`;
// 평소엔 숨기고, 1분 넘게 조용할 때만 '멈췄나?'를 알 수 있게 띄움
const pulseText = d => `마지막 활동 ${dur(d)} 전`;
function updatePulses() {
  document.querySelectorAll("#agents .pulse").forEach(el => {
    const d = quietSecs(el.dataset.last, +el.dataset.since);
    el.className = "pulse" + (d >= 120 ? " quiet" : "");
    el.hidden = d < 60;
    el.textContent = d < 60 ? "" : pulseText(d);
  });
}
// 대화창 바닥의 '돌아가는 중' 표시: 일하는 에이전트마다 한 줄 (뭘 하는지·걸린 시간·마지막 움직임). 멈춤·일시정지도 같이
function updateTyping(agents) {
  const el = $("#typing"), sec = $("#tlsec");
  const stick = sec.scrollHeight - sec.scrollTop - sec.clientHeight < 40;
  const rows = Object.entries(agents || {}).map(([n, a]) => {
    if (a.error) return `<div class="tp err" style="--c:var(--warn)">⚠ ${NAME[n]} ${errHelp(n, a).title} — 오른쪽 카드에 해결 방법</div>`;
    if (a.paused && a.status !== "working") return `<div class="tp quiet">${NAME[n]} 일시정지됨 — 오른쪽 카드에서 재개</div>`;
    if (a.status !== "working") return "";
    // 마지막 움직임은 에이전트가 중간 신호를 드문드문 보내 믿을 게 못 됨 → 대화창엔 하는 일·걸린 시간만
    const doing = doingText(a.doing);
    // 이번 차례의 가장 최근 활동(중간에 한 말·명령·수정 파일)을 아랫줄에 — 에이전트가 따로 알리지 않아도 진행이 보이게
    const turnSecs = Date.now() / 1000 - a.since;
    const act = (a.activity || []).filter(x => ["text", "tool", "edit", "sub"].includes(x.kind)
      && (secsAgo(x.ts) ?? Infinity) <= turnSecs + 2 && !/^\s*대기\s*$/.test(x.text || "")).at(-1);
    const actText = !act ? "" : act.kind === "edit" ? "수정: " + act.text.replace(/^(Edit|Write|MultiEdit): /, "")
      : act.kind === "tool" ? act.text.replace(/^\$ /, "").replace(/^Bash: /, "") : act.text;
    const last = actText ? `<div class="tp-act" title="${esc(actText)}">${esc(actText.trim().split("\n")[0].slice(0, 160))}</div>` : "";
    return `<div class="tp" style="--c:var(--${n})">${NAME[n]} ${esc(doing || "작업 중")}<span class="nw">· ${elapsedLive(a.since)}</span>${a.paused ? '<span class="nw">· 끝나면 멈춤</span>' : ""}</div>${last}`;
  }).join("");
  el.innerHTML = rows; el.hidden = !rows;
  if (stick) sec.scrollTop = sec.scrollHeight;
}
// '짧은 제목 — 상세 설명' 문구를 [제목, 상세]로 (구분자 없으면 상세 없음)
const splitMsg = t => { const s = String(t ?? ""), i = s.indexOf(" — "); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + 3)]; };
function cancelJob(id) {
  if (confirm(`요청 ${id}을(를) 취소할까요?\n지금 하던 차례는 멈추고 이 요청을 닫습니다. 이미 바뀐 파일은 그대로 남습니다.`))
    api({action: "cancel_job", id});
}
// 진행 중 요청 묶음의 한 줄 상태: 이 요청을 맡아 일하는 에이전트·멈춘 에이전트·요청 후 경과 시간 (매초 갱신, 다시 그리기 없이 글자만 교체)
function updateLiveBars(agents) {
  document.querySelectorAll(".livebar").forEach(el => {
    const jid = +el.dataset.job, parts = [];
    for (const [n, a] of Object.entries(agents || {})) {
      if (a.error) parts.push(`⚠ ${NAME[n]}${lastJobs.find(x => x.id === jid)?.lead === n ? "(리더)" : ""} ${errHelp(n, a).title} — 오른쪽 카드의 해결 방법대로 한 뒤 [다시 시도]`);
      else if (a.paused) parts.push(`${NAME[n]} 일시정지됨 — 재개해야 진행돼요`);
      else if ((a.notice || "").startsWith("자동 재시도 대기"))   // 좁은 화면에선 에이전트 카드가 접혀 있어 여기에도 띄움
        parts.push(`${NAME[n]} ${a.notice.replace(/^자동 재시도 대기 — /, "자동 재시도 대기 · ")}`);
      else if (a.status === "working" && a.doing?.job === jid)
        parts.push(`${NAME[n]}: ${doingText(a.doing) || "작업 중"}${(a.subs || []).length ? ` (보조 ${a.subs.length})` : ""}`);
    }
    // 단계 점: 계획 → 작업(완료 작업 n/m) → 확인 → 완료
    const job = lastJobs.find(x => x.id === jid), jt = lastTasks.filter(x => x.job === jid);
    const order = ["planning", "working", "review", "done"], cur = Math.max(0, order.indexOf(job?.status));
    const label = ["계획", jt.length ? `작업 ${jt.filter(x => x.status === "done").length}/${jt.length}` : "작업", "확인", "완료"];
    el.querySelector(".stage").innerHTML = label.map((l, i) =>
      `<span class="st ${i < cur ? "past" : i === cur ? "now" : ""}">${l}</span>`).join('<span class="arr">›</span>');
    const since = +el.dataset.since;   // 요청 시각(날짜 포함): 자정을 넘겨도 경과 시간이 맞게
    const ago = since ? ` · 요청 후 ${elapsed(since)}` : "";
    const warn = parts.some(p => p.startsWith("⚠") || p.includes("일시정지"));
    el.classList.toggle("warn", warn);
    // 경고가 있으면 줄을 통째로 아랫줄에 두고 경고마다 '제목 굵게 + 상세 작게' (길어져도 단계 칩 옆에서 꼬이지 않게)
    el.querySelector(".lb-text").innerHTML = warn
      ? parts.map(p => { const [h, d] = splitMsg(p); return `<span class="w-head">${esc(h)}</span>${d ? `<span class="w-detail">${esc(d)}</span>` : ""}`; }).join("<br>") + (ago ? `<span class="w-detail">${esc(ago.replace(/^ · /, ""))}</span>` : "")
      : esc((parts.join(" · ") || "다음 차례 대기 중") + ago);
  });
}
function jumpTo(id, again) {
  const el = document.getElementById("th-" + id);
  if (!el) {   // 압축된 이전 요청이면 펼친 뒤 다시 이동
    if (again) return toast("대화창에서 이 요청을 찾지 못했습니다.");
    expandedOld.add(id); openTurns.add("old"); lastSig = "";
    return refresh().then(() => jumpTo(id, true));
  }
  document.body.classList.remove("show-side");
  el.scrollIntoView({behavior: "smooth", block: "start"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
}

function renderGit(g, parallel) {
  if (!parallel) {
    $("#gitbox").innerHTML = "";   // git 아닌 폴더: 병합할 게 없으니 아무것도 안 띄움
    return;
  }
  if (!g) { $("#gitbox").innerHTML = ""; return; }
  const pending = g.changed || g.ahead;
  const what = [g.changed ? `변경 파일 ${g.changed}개` : "", g.ahead ? `커밋 ${g.ahead}개` : ""].filter(Boolean).join(" · ");
  $("#gitbox").innerHTML = `<div class="gitbox">
      <div class="br" title="작업 폴더: ${esc(g.path)}">브랜치 ${esc(g.branch)}</div>
      <div class="row"><span>${pending ? `${what}이 ${esc(g.main)}에 아직 반영되지 않았습니다.` : `${esc(g.main)}와 같은 상태입니다.`}</span>
        ${pending ? `<button onclick='if(confirm("이 대화의 작업 내용을 메인 폴더(${esc(g.main)})에 병합할까요?"))api({action:"merge"})'>메인에 병합</button>` : ""}</div>
    </div>`;
}

let reqSeq = 0, appliedSeq = 0, inflight = null, inflightGen = 0;
// 동시에 하나만 요청(서버가 느릴 때 1초마다 쌓이지 않게). 진행 중이면 그 요청을 같이 기다림
// 진행 중 조회가 대화 전환 전에 시작됐으면 끝난 뒤 한 번 더 조회해 바로 새 대화를 보여줌
function refresh() {
  if (inflight && inflightGen < followGen) return inflight.then(refresh);
  if (!inflight) { inflightGen = followGen; inflight = doRefresh().finally(() => { inflight = null; }); }
  return inflight;
}
// 렌더 하나가 실패해도 나머지는 계속 그리고, '서버 끊김'으로 오인하지 않게 렌더 오류와 통신 오류를 나눔
const safe = (name, f) => { try { f(); return true; } catch (e) { console.error(name, e); return false; } };
const headlessClient = /HeadlessChrome/i.test(navigator.userAgent);
const clientId = headlessClient ? "" : crypto.randomUUID();
let officeClosed = false, clientReady = headlessClient;
function closeOfficeWindow(updating = updateState.state === "restarting") {
  if (officeClosed) return;
  officeClosed = true;
  clearInterval(refreshTimer);
  window.close();
  const cover = document.createElement("div");
  cover.setAttribute("role", "alert");
  cover.style.cssText = "position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:var(--bg);color:var(--text);padding:24px;text-align:center;font-size:16px";
  cover.textContent = updating ? "업데이트한 Office가 새 창에서 열려요. 이 창을 닫으세요." : "Office가 종료됐어요. 이 창을 닫으세요.";
  document.body.appendChild(cover);
}
async function registerClient() {
  if (clientReady) return;
  const r = await fetch("/api", {method: "POST", body: JSON.stringify({action: "hello", client: clientId}), signal: AbortSignal.timeout(8000)});
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || "창을 등록하지 못했어요.");
  clientReady = true;
}
async function doRefresh() {
  if (officeClosed) return;
  const seq = ++reqSeq, gen = followGen, follow = gen > followDone;
  let s;
  try {
    await registerClient();
    // 대화 전환·새 대화·복원 직후엔 옛 대화를 고정하지 말고 서버가 정한 현재 대화를 받아옴
    // 바뀐 게 없으면 서버가 {unchanged} 만 보내게 마지막 rev를 같이 보냄 (같은 대화일 때만)
    let q = curSession && !follow ? "?session=" + encodeURIComponent(curSession) + (lastRev != null && revSession === curSession && lastSig && lastSess ? "&since_rev=" + lastRev : "") : "";
    if (clientId) q += (q ? "&" : "?") + "client=" + encodeURIComponent(clientId);
    const r = await fetch("/api/state" + q, {signal: AbortSignal.timeout(8000)});
    s = await r.json().catch(() => ({}));
    if (!r.ok || s.error) throw new Error(s.error || `서버 오류 ${r.status}`);   // 화면은 이전 상태 그대로 두고 문구만
  } catch (e) {
    // 서버가 꺼져 접속 자체가 거부되면(TypeError) 3번 연속 확인 뒤 창도 같이 닫음. 응답만 느린 건(Timeout) 닫지 않음
    if (updateState.state === "restarting" && e.name === "TypeError") { closeOfficeWindow(true); return; }
    downCount++;
    if (!headlessClient && downCount >= 3) { closeOfficeWindow(); return; }
    const conn = $("#conn");
    if (conn) {
      conn.textContent = e.name === "TypeError" || e.name === "TimeoutError"
        ? "서버와 연결이 끊어졌습니다 — 콘솔에서 office를 다시 실행하면 새 창이 열립니다 (이 창은 닫아도 됨)"
        : `서버가 상태를 못 보냈습니다: ${e.message}`;
      conn.removeAttribute("title"); conn.hidden = false;
    }
    return;
  }

  if (s.unchanged && new Date().toDateString() !== lastDay) { lastRev = null; return; }   // 자정 지남: 다음 조회에서 전체를 받아 날짜 표시를 다시 그림
  if (s.unchanged) {   // 상태 그대로: 다시 그리지 않고 경과 시간·진행 줄만 갱신

    return;
  }
  {

    appliedSeq = seq;
    lastRev = s.rev ?? null; revSession = s.session; lastAgentState = s.agents || {};
    if (follow) followDone = Math.max(followDone, gen);   // 조회 시작 뒤 또 전환했으면 다음 조회도 서버를 따라감
    // 서버가 보낸 경고(상태 파일 복구 등)는 헤더에 띄우고, 없으면 숨김
    const warn = (s.warnings || []).join(" · ");
    $("#conn").textContent = warn; $("#conn").removeAttribute("title"); $("#conn").hidden = !warn;
    $("#root").textContent = s.root;
    const version = typeof s.version === "string" ? s.version.trim() : "";
    $("#version").textContent = version ? "v" + version.replace(/^v/, "") : "";
    $("#version").hidden = !version;
    if (s.session !== curSession) {   // 대화 전환: 쓰던 초안은 그 대화에 남겨두고 새 대화 초안을 불러옴
      if (curSession) drafts[curSession] = $("#input").value;
      $("#input").value = drafts[s.session] || ""; grow();
      curSession = s.session; forceBottom = false; lastSig = ""; lastMsgs = 0; openTurns = new Set(); expandedOld = new Set();
    }
    const msgs = s.msgs || [], jobs = s.jobs || [], tasks = s.tasks || [];
    stampMsgs(msgs, jobs);

    const ss = JSON.stringify(s.sessions) + s.session;
    if ((ss !== lastSess || Date.now() - lastSessAt > 30000) && safe("sessions", () => renderSessions(s.sessions || [], s.session))) { lastSess = ss; lastSessAt = Date.now(); }

    const tsig = lastDay + "|" + msgs.length + "|" + (last && last.id + last.text?.length) + JSON.stringify(jobs);
    if (tsig !== lastSig && safe("timeline", () => renderTimeline(msgs, jobs))) lastSig = tsig;
    const resv = s.file_reservations || [];
    const bsig = JSON.stringify(jobs) + JSON.stringify(tasks) + JSON.stringify(resv);   // 작업만 바뀌면 대화창은 그대로 두고 현황판만
    if (bsig !== lastBoardSig && safe("board", () => renderBoard(jobs, tasks, resv, s.session))) lastBoardSig = bsig;
    safe("livebars", () => updateLiveBars(s.agents));

  }
}
let downCount = 0, lastSessAt = 0, lastBoardSig = "", lastJobs = [], lastTasks = [], lastRev = null, revSession = null, lastAgentState = {};
setMode(["job", "claude", "codex"].includes(localStorage.officeMode) ? localStorage.officeMode : "job");
// 최소화된 창도 서버 종료를 감지한다 (브라우저가 백그라운드 타이머를 늦출 수 있음).
refresh(); const refreshTimer = setInterval(refresh, 1000);
