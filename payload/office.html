<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 256x256">
<link rel="apple-touch-icon" href="/icon.png">
<script>try { const t = new URLSearchParams(location.search).get("theme") || localStorage.officeTheme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  --bg: #f5f5f3; --panel: #ffffff; --line: #e4e3df; --text: #1d1d1b; --muted: #6a6862; --faint: #85827b;
  --wait: #6a4cb0; --wait-soft: #ece6f8; --claude: #9c4a20; --claude-soft: #f6e8df; --codex: #2c64b0; --codex-soft: #e2ebf7;
  --user-soft: #ecebe7; --accent: #1d1d1b; --pin: #a07a52; --on-accent: #ffffff; --warn: #8a5f00; --warn-soft: #fbf1d9;
  --ok: #2f7d4f; --chip: #f0efeb;
}
/* 테마: 기본은 OS 설정 따라감, 헤더 버튼으로 밝게/어둡게 고정(data-theme) */
:root[data-theme="dark"] { --bg: #151514; --panel: #1d1d1b; --line: #2f2e2b; --text: #ecebe6; --muted: #9a978f; --faint: #85827b;
  --wait: #b9a0f0; --wait-soft: #2a2340; --claude: #e3916a; --claude-soft: #33241c; --codex: #79a6e8; --codex-soft: #1c2738;
  --user-soft: #2a2a27; --accent: #ecebe6; --pin: #c4a07c; --on-accent: #151514; --warn: #e5b94e; --warn-soft: #3a2f14;
  --ok: #6cc290; --chip: #262624; color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151514; --panel: #1d1d1b; --line: #2f2e2b; --text: #ecebe6; --muted: #9a978f; --faint: #85827b;
    --wait: #b9a0f0; --wait-soft: #2a2340; --claude: #e3916a; --claude-soft: #33241c; --codex: #79a6e8; --codex-soft: #1c2738;
    --user-soft: #2a2a27; --accent: #ecebe6; --pin: #c4a07c; --on-accent: #151514; --warn: #e5b94e; --warn-soft: #3a2f14;
    --ok: #6cc290; --chip: #262624; color-scheme: dark; }
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: anywhere; }   /* 한글이 '4 / 분'처럼 낱글자로 끊기지 않게, 긴 경로는 아무 데서나 줄바꿈 */
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
svg.sm { width: 14px; height: 14px; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.version { background: none; border: 0; padding: 2px 4px; position: relative; text-decoration: none; text-underline-offset: 3px; color: var(--muted); font-size: 11px; font-weight: 400; white-space: nowrap; }
.version:hover { text-decoration: underline; }
.version.has-update::after { content: ""; position: absolute; top: 0; right: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--codex); }
.version:focus-visible { outline: 2px solid var(--codex); outline-offset: 3px; }
.brand .mark svg { width: 14px; height: 14px; }
.root .path { cursor: pointer; }
.root .path:hover { color: var(--accent); }
.root { color: var(--muted); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { font-size: 12px; color: var(--warn); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover { background: var(--chip); }
button.ghost { border-color: transparent; background: none; color: var(--muted); padding: 4px; }
button.ghost:hover { color: var(--text); background: var(--chip); }

main { display: grid; grid-template-columns: 220px 1fr 340px; min-height: 0; }

/* 대화 목록 */
.sessions { background: var(--panel); display: flex; flex-direction: column; padding: 12px 10px; }
.newbtn { width: 100%; justify-content: center; background: var(--accent); color: var(--on-accent); border-color: var(--accent); margin-bottom: 12px; }
.newbtn:hover { background: var(--accent); opacity: .88; }
.slist { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.sitem { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.sitem:hover { background: var(--chip); }
.sitem.on { background: var(--chip); box-shadow: inset 2px 0 0 var(--accent); }
.sitem .sm-meta { flex: 1; min-width: 0; }
.sitem .stitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.sitem .stitle-row { display: flex; align-items: center; gap: 6px; }
/* 고정 핀은 차분한 황토색으로 채워 구분. 고정 버튼이 보일 땐(마우스 오버·선택) 제목 옆 표시를 숨겨 핀이 하나만 보이게 */
.sitem .pin-mark { color: var(--pin); display: inline-flex; flex: 0 0 12px; }
.sitem .pin-mark svg { width: 12px; height: 12px; fill: currentColor; }
.sitem:hover .pin-mark, .sitem.on .pin-mark, .sitem:focus-within .pin-mark { display: none; }
.sitem .acts button[aria-pressed="true"] { color: var(--pin); }
.sitem .acts button[aria-pressed="true"] svg { fill: currentColor; }
.sitem .stitle-row .stitle { flex: 1; min-width: 0; }
/* 새 소식이 온 대화: 항목 전체가 은은한 푸른빛으로 숨쉬듯 반짝 */
.sitem.has-unread { background: rgba(76, 141, 255, .07); box-shadow: inset 2px 0 0 rgba(76, 141, 255, .7); animation: unread-glow 2.4s ease-in-out infinite; }
.sitem.has-unread .stitle { font-weight: 600; }
@keyframes unread-glow { 0%, 100% { background: rgba(76, 141, 255, .05); } 50% { background: rgba(76, 141, 255, .16); } }
@media (prefers-reduced-motion: reduce) { .sitem.has-unread { animation: none; } }
.sitem.on .stitle { font-weight: 600; }
.sitem .ssub { font-size: 11px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.sitem .ssub .live { color: var(--ok); }
.sitem .ssub .live.waiting, .sitem .ssub .live.ask { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: 99px; font-weight: 600; }
.sitem .ssub .live.waiting { background: var(--wait-soft); color: var(--wait); }
.sitem .ssub .live.ask { background: var(--warn-soft); color: var(--warn); }
.sitem .acts { display: none; }
.sitem:hover .acts, .sitem.on .acts { display: flex; }
.sitem .acts button { padding: 3px; }
.trash { flex: none; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
#tlist { max-height: min(35vh, 220px); overflow-y: auto; overscroll-behavior: contain; margin-top: 4px; }
.trash summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: flex; gap: 6px; align-items: center; }
.trash summary::-webkit-details-marker { display: none; }
.trash .sitem { cursor: default; opacity: .8; }
.trash .acts { display: flex; }
.trash summary .emptyTrash { margin-left: auto; font-size: 12px; padding: 2px 6px; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--accent); color: var(--on-accent);
  width: max-content; max-width: calc(100vw - 32px); padding: 8px 8px 8px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: center; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.toast button { background: none; border-color: transparent; color: var(--on-accent); font-weight: 600; text-decoration: underline; white-space: nowrap; flex: none; }
.toast button:hover { background: none; opacity: .8; }
.toast .toast-x { text-decoration: none; font-weight: 400; font-size: 16px; line-height: 1; padding: 2px 6px; }
section { min-height: 0; overflow: auto; padding: 14px; }
section + section { border-left: 1px solid var(--line); }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }

/* 에이전트 */
.agent { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.agent .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.avatar { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 11.5px; letter-spacing: .02em; }
.agent .meta { flex: 1; min-width: 0; }.agent .name { font-weight: 600; }
.agent .st { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.working { animation: pulse 1.2s ease-in-out infinite; }
.dot.paused { background: var(--warn); }
@keyframes pulse { 50% { opacity: .25; } }
.usage { border-top: 1px solid var(--line); padding: 8px 12px; display: grid; gap: 5px; font-size: 11.5px; color: var(--muted); }
.usage .u { display: grid; grid-template-columns: 38px 1fr 34px; gap: 8px; align-items: center; }
.usage .bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.usage .bar i { display: block; height: 100%; border-radius: 3px; }
.usage .pct { text-align: right; font-variant-numeric: tabular-nums; }
.usage .tok { display: flex; justify-content: space-between; }
.sitem:focus-within .acts { display: flex; }
.sitem input.rename { width: 100%; font: inherit; font-size: 13px; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--text); }
.toast span { white-space: pre-line; }
.task .tno { color: var(--muted); font-variant-numeric: tabular-nums; }
.trash .acts button.txt { font-size: 11.5px; padding: 2px 6px; }
.trash .acts button.danger { color: var(--warn); }
.sitem .ssub .stop { color: var(--warn); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.event, .task .note, .summary, details.turn pre, .gitbox .row span, .msg .body { overflow-wrap: anywhere; }
.conn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
@media (prefers-reduced-motion: reduce) { .dot.working, .task.doing > svg { animation: none; } }
/* 실제 캡처에서 상태줄('일하는 중 · 작업 진행 · 2분')이 카드 폭에 잘려 보여서 줄바꿈 허용 */
/* 상태줄은 '● 일하는 중 · 29초' 한 줄 고정, 하는 일은 아랫줄에 따로 (중간에서 어색하게 끊기지 않게) */
.agent .st { display: block; line-height: 1.45; }
/* 버튼(잠시 멈춤·중단)은 한 줄에 나란히, 남는 폭은 이름·하는 일이 쓰고 넘치면 하는 일만 말줄임 */
/* 한도 배지·버튼은 한 묶음(.ctl): 이름·하는 일이 최소 6em을 못 지키면 묶음째 오른쪽 아랫줄로 */
.agent .top { flex-wrap: wrap; row-gap: 4px; }
.agent .meta { flex: 1 1 6em; min-width: 0; }
.agent .ctl { display: flex; align-items: center; gap: 4px; flex: none; margin-left: auto; }
.agent .ctl button.ghost { padding: 4px; }
.nw { white-space: nowrap; }
/* 카드 머리: 1줄 '이름 · 경과시간(작게)', 2줄 '● 하는 일' — 일하는 중이면 점이 움직이니 '일하는 중' 글자는 생략, 하는 일이 주 정보 */
.agent .name { display: flex; align-items: baseline; gap: 6px; }
.agent .name .el { font-weight: 400; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.agent .st { display: flex !important; align-items: center; gap: 6px; min-width: 0; }
.agent .st .dot { flex: none; margin: 0 !important; }
.agent .st .what { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .st.now .what { color: var(--text); }
.agent .st.now .dot { animation: pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .agent .st.now .dot { animation: none; } }
.agent .st .dot { display: inline-block; vertical-align: middle; margin: -2px 6px 0 0; }
.agent .top button.ghost { font-size: 12px; padding: 3px 8px; white-space: nowrap; }
.agent .hot { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.agerr { display: flex; gap: 6px; align-items: flex-start; margin: 0 12px 8px; padding: 6px 8px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 12px; word-break: break-word; }
.agerr svg { margin-top: 2px; }
.agerr .how { color: var(--text); margin-top: 2px; }
.agerr details.raw summary { cursor: pointer; color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.agerr details.raw code { display: block; white-space: pre-wrap; font-size: 11px; color: var(--muted); margin-top: 2px; }
.pulse { margin: 0 12px 6px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pulse::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
/* 오래 조용한 건 오류가 아님(긴 생각·긴 명령 실행 중) — 경고색 없이 차분하게. 진짜 오류는 서버가 error/notice로 따로 알림 */
.readnote { margin: 6px 0 0; font-size: 11.5px; color: var(--faint); word-break: keep-all; }
/* 안 읽힌 메시지는 말풍선 너비·안내 줄을 처음부터 고정해 글이 바뀌어도 대화창이 흔들리지 않게 */
.msg.pend { min-width: min(80%, 27em); }
.msg.pend .readnote { line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 0; min-width: 100%; box-sizing: border-box; }
.pulse.quiet { color: var(--muted); }
.pulse.quiet::before { background: var(--faint); animation: none; }
.dot.wrap { background: var(--faint); animation: none; }
.agent details.subs { margin: 0 12px 6px; }
.subchip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--text); }
.subrow { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0 3px 18px; }
.subrow .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subrow .ts { color: var(--faint); font-variant-numeric: tabular-nums; }
.agnote { margin: 0 12px 8px; padding: 5px 8px; border-radius: 8px; background: var(--chip); color: var(--muted); font-size: 12px; }
.feed.now { max-height: none; padding: 4px 12px 6px; }
.agent details.more-info { border-top: 1px solid var(--line); }
.agent details.more-info > summary { padding: 6px 12px; font-size: 12px; }
.side h2 + #agents { margin-bottom: 18px; }
details.scores { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
details.scores > summary { padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; gap: 6px; align-items: center; list-style: none; }
details.scores > summary::-webkit-details-marker { display: none; }
details.scores > summary svg { transition: transform .15s; }
details.scores[open] > summary svg { transform: rotate(90deg); }
#scores { padding: 0 12px 10px; font-size: 12px; }
#scores h3 { margin: 10px 0 4px; font-size: 12.5px; }
#scores table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#scores th, #scores td { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
#scores th:first-child, #scores td:first-child { text-align: left; white-space: normal; word-break: keep-all; }
#scores th { color: var(--muted); font-weight: 600; }
#scores .few { color: var(--faint); }
#scores .empty, #scores .hint { margin: 8px 0 0; color: var(--muted); word-break: keep-all; text-wrap: pretty; }
.feed { border-top: 1px solid var(--line); max-height: 300px; overflow: auto; padding: 6px 12px; font-size: 12px; }
.feed .row { display: flex; gap: 8px; padding: 3px 0; align-items: flex-start; }
.feed .row svg { margin-top: 2px; color: var(--muted); }
.feed .tx { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
.feed .more { color: var(--faint); padding-left: 22px; }
.feed .more .last { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; color: var(--muted); }
.feed .say { padding-left: 22px; color: var(--text); }
.feed .more .tx, .feed .say .tx { -webkit-line-clamp: 1; }
.feed details.more { display: block; }
.feed details.more > summary { cursor: pointer; list-style: none; display: flex; }
.feed details.more > summary::-webkit-details-marker { display: none; }
.feed details.more > summary:hover .tx { color: var(--text); }
.feed details.more[open] > summary .last { display: none; }
.feed .cmds { margin: 2px 0 4px; border-left: 2px solid var(--line); padding-left: 8px; }
.feed .cmd { display: flex; gap: 8px; padding: 1px 0; }
.feed .cmd code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); }
.feed .edit .tx { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
.feed .tx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.feed .start { color: var(--text); font-weight: 600; }
.feed .sep { border-bottom: 1px dashed var(--line); margin: 4px 0; }
.feed .ts { color: var(--faint); font-variant-numeric: tabular-nums; }

/* 대화 */
#timeline { display: flex; flex-direction: column; gap: 10px; max-width: 860px; margin: 0 auto; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; word-break: break-word; }
.msg .body { white-space: pre-wrap; }
.msg .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
.msg .who .ts { color: var(--faint); font-weight: 400; }
.msg.user { align-self: flex-end; background: var(--user-soft); border-bottom-right-radius: 4px; }
.msg.claude { background: var(--claude-soft); border-bottom-left-radius: 4px; }
.msg.codex { background: var(--codex-soft); border-bottom-left-radius: 4px; }
.msg .who .nm.claude, .event .nm.claude { color: var(--claude); }
.msg .who .nm.codex, .event .nm.codex { color: var(--codex); }
.msg .who .nm.user { color: var(--text); }
.msg .who .arrow { color: var(--faint); font-weight: 400; }
/* 이름·시각이 긴 본문에 밀려 한 글자 폭으로 찌그러지지 않게: 이름·시각은 줄바꿈 금지, 알림 줄은 일반 글 흐름으로 */
.msg .who > * { flex: none; white-space: nowrap; }
.event { display: block !important; }
.event > b, .event > span:last-child { white-space: nowrap; }
.event > b { margin-right: 6px; }
.event > span:last-child { margin-left: 6px; color: var(--faint); }
.event > svg { margin-right: 6px; }
.msg.toUser { box-shadow: inset 3px 0 0 var(--warn); }
.event { align-self: center; color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; text-align: center; max-width: 90%; }
.event b { font-weight: 600; }
.event.claude b { color: var(--claude); } .event.codex b { color: var(--codex); }
.event.alert { color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 8px; }
.msg .body code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
.msg .body { line-height: 1.65; white-space: normal; word-break: keep-all; }
.msg .body .p { margin: 0; }
.msg .body .p + .p { margin-top: 10px; }
.msg .body .md-list { margin: 8px 0; padding-left: 22px; }

.user-action .body pre.codeblock { margin: 8px 0; padding: 10px 12px; max-width: 100%; overflow-x: auto; white-space: pre; overflow-wrap: normal; word-break: normal; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; line-height: 1.5; }
.user-action .body a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.user-action .body a:hover { color: var(--accent); }
.user-action .body .path { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.user-action .body .path:hover { color: var(--accent); }
.user-action .body pre.codeblock code { background: none; padding: 0; border-radius: 0; }
.user-action .body .code-lang { display: block; margin-bottom: 6px; color: var(--muted); font: 11px ui-monospace, monospace; }
.user-action .body .gap { height: 8px; }
.user-action .body .h { font-weight: 700; font-size: 14.5px; color: var(--text); margin: 18px 0 7px; line-height: 1.5; }
.user-action .body .gap + .h { margin-top: 8px; }
.user-action .body .h + .gap { display: none; }
.user-action .body .h:first-child { margin-top: 0; }
.user-action .body .li { position: relative; padding-left: 16px; margin: 3px 0; }
.user-action .body .li::before { content: "•"; position: absolute; left: 3px; color: var(--muted); }
.user-action .body .li.num { padding-left: 22px; }
.user-action .body .li.num::before { content: none; }
.user-action .body .li .n { position: absolute; left: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.user-action .body .quote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.user-action .body .lead1 { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.user-action .body .code-toolbar .code-lang { margin: 0; }
.user-action .body .code-shell pre.codeblock { margin: 0; border: 0; border-radius: 0; }
#timeline.empty-timeline { min-height: 100%; justify-content: center; align-items: center; }
.empty-conversation { color: var(--faint); font-size: 25px; font-weight: 500; text-align: center; padding: 24px; }
@media (max-width: 600px) {
  header { gap: 6px; }
  .brand { flex: none; white-space: nowrap; }
  .brand .version { max-width: 68px; }
  header .narrow-only:not(.ghost) { font-size: 12px; padding: 4px 6px; }
  .update-notice { left: 12px; right: 12px; width: auto; top: calc(var(--office-header-height, 52px) + 8px); max-height: calc(100dvh - var(--office-header-height, 52px) - 20px); padding: 16px; }
}
/* 입력 */
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 12px; display: grid; gap: 6px; }
/* 입력 상자 하나 안에 글 쓰는 칸 + 아래 도구 줄(보낼 대상 · 요청 옵션 · 보내기) */
.composer { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); display: grid; }
.composer:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.ctools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 8px 0; }
/* 입력칸이 길어져도 아래에 빈 줄이 안 생기게: 보내기는 입력칸 오른쪽 아래에 붙여요 */
.cinput { display: flex; align-items: flex-end; gap: 8px; padding: 0 8px 8px 0; }
.cinput textarea { flex: 1; }
.cinput .send { flex: none; margin-left: 0; }
.jobopts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.jobopts[hidden] { display: none; }
#modes button { gap: 0; }   /* '모두'+'에게' 사이 버튼 기본 간격 없애기 */
.ctools .sep { width: 1px; align-self: stretch; margin: 4px 0; background: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; border-radius: 7px; padding: 4px 10px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent); }
#verify button { padding: 4px 8px; }
.lead { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
select { font: inherit; font-size: 12px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; }
#tlsec, .composer textarea { min-width: 0; }
textarea { flex: 1; resize: none; height: 56px; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.composer textarea { border: 0; background: transparent; padding: 8px 12px 6px; }
.composer textarea:focus { outline: 0; }
.send { background: var(--accent); color: var(--on-accent); border-color: var(--accent); padding: 6px 14px; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.send:hover { background: var(--accent); opacity: .88; }
.hint { font-size: 11.5px; color: var(--faint); }
@media (max-width: 1300px) { main { grid-template-columns: 190px 1fr 300px; } }
/* 좁은 화면: 대화창만 꽉 채우고, 대화 목록·현황은 헤더 버튼으로 여는 서랍 */
.narrow-only { display: none; }
@media (max-width: 1100px) {
  .narrow-only { display: inline-flex; }
  main { grid-template-columns: minmax(0, 1fr); position: relative; }   /* 1fr 은 긴 한 줄(상태 줄 등)만큼 넓어져 화면 밖으로 넘침 */
  main > .sessions, main > .side { position: absolute; top: 0; bottom: 0; width: min(340px, 88vw); z-index: 5; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,.22); background: var(--bg); border: 0; }
  main > .sessions { left: 0; background: var(--panel); }
  main > .side { right: 0; }
  body.show-sessions main > .sessions, body.show-side main > .side { display: flex; flex-direction: column; }
  body.show-side main > .side { display: block; }
}
/* 아주 좁은 화면(폰 폭): 헤더는 꼭 필요한 버튼만, 글자 버튼은 아이콘으로 */
@media (max-width: 600px) {
  header { gap: 8px; padding: 8px 10px; }
  header .root, #quit .lbl { display: none; }
  footer { padding: 8px 10px 10px; }
  .send { padding: 6px 10px; }
  .send .lbl, #modes .to, .ctools .sep { display: none; }
  .seg button { padding: 4px 8px; }
  .msg { max-width: 92%; }
}
/* ── 길이가 바뀌는 문구는 길어질 걸 전제로: '제목 — 상세'는 제목 굵게 한 줄 + 상세 아랫줄, 짧은 메타는 한 줄 고정 ── */
.event.alert { display: flex !important; align-items: flex-start; gap: 8px; text-align: left; max-width: min(640px, 92%); padding: 8px 12px; line-height: 1.5; }
.event.alert > svg { flex: none; margin: 3px 0 0; }
.event.alert .ev-body { flex: 1; min-width: 0; }
.event.alert .ev-head { font-weight: 600; }
.event.alert .ev-detail { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.event.alert.success { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.event.alert a { color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }
.event.alert > span.ts { flex: none; margin-left: 4px; color: var(--faint); white-space: nowrap; }
/* 질문 아래 진행 줄은 한 줄 높이로 고정: 글이 길어도 줄바꿈 대신 말줄임(전체는 툴팁), 경고일 때만 여러 줄 */
.livebar:not(.warn) { flex-wrap: nowrap; min-height: 34px; box-sizing: border-box; }
.livebar:not(.warn) .stage, .livebar:not(.warn) .cancel { flex: none; white-space: nowrap; }
.livebar:not(.warn) .lb-text { min-width: 0; }
@media (max-width: 560px) { .livebar:not(.warn) { flex-wrap: wrap; min-height: 0; } .livebar:not(.warn) .lb-text { flex-basis: 100%; order: 3; } }
.livebar:not(.warn) .lb-text { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.livebar:not(.warn) .lb-status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.livebar:not(.warn) .lb-progress { display: flex; flex: 0 1 auto; min-width: 0; overflow: hidden; gap: 8px; }
.livebar:not(.warn) .task-progress { display: flex; align-items: center; gap: 6px; margin-top: 0; min-width: 0; white-space: nowrap; }
.livebar:not(.warn) .task-progress .progress-text { overflow: hidden; text-overflow: ellipsis; }
.livebar:not(.warn) .task-progress progress { width: 56px; flex: none; }
.livebar:not(.warn) .task-progress .freshness { display: none; }
.livebar.warn .lb-text { flex-basis: 100%; order: 3; line-height: 1.5; }
.livebar .w-head { font-weight: 600; }
.livebar .w-detail { display: block; font-size: 11.5px; opacity: .85; }
.sitem .ssub { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
.sitem .ssub > * { white-space: nowrap; }
.sitem .ssub > :last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const syncHeaderHeight = () => document.documentElement.style.setProperty("--office-header-height", $("header").getBoundingClientRect().height + "px");
if (typeof ResizeObserver !== "undefined") new ResizeObserver(syncHeaderHeight).observe($("header"));
window.addEventListener("resize", syncHeaderHeight);
syncHeaderHeight();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nm = n => NAME[n] ?? esc(n ?? "—");
// 이름에 각자 색: 'Codex → Claude'처럼 보낸 쪽·받는 쪽이 한눈에 구분되게
const tag = n => `<span class="nm ${["claude", "codex", "user"].includes(n) ? n : ""}">${nm(n)}</span>`;   // 이름표에 없는 값이 와도 'undefined' 대신 원문(이스케이프)
const icon = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const NAME = {claude: "Claude", codex: "Codex", user: "나", system: "시스템", all: "전체"};
const STATUS = {idle: "쉬는 중", working: "일하는 중", paused: "멈춤"};
const DOING = {plan: j => `요청 ${j} 작업 계획 수립`, review: j => `요청 ${j} 결과 검수`,
               reply: () => "메시지 확인", work: () => "작업 진행", continue: () => "작업 이어서 진행"};
const STEP = {look: "살펴보는 중", edit: "고치는 중", check: "확인하는 중", wrap: "마무리하는 중"};
function doingText(doing) {
  if (!doing) return "";
  const label = DOING[doing.kind]?.(doing.job) || "";
  const step = ["work", "continue", "plan"].includes(doing.kind) ? STEP[doing.step] : "";
  return label && step ? `${label} · ${step}` : label;
}
const JOBST = {planning: "계획 세우는 중", working: "작업 중", review: "결과 확인 중", waiting: "기다리는 중", done: "완료"};
// 남은 작업이 기다리는 상태라면 요청도 완료로 보이지 않게 표시해요.
function jobStatus(j, tasks = lastTasks) {
  if (j.display_status) return j.display_status;   // 서버가 실제 실행 상태로 계산한 값
  const open = tasks.filter(t => t.job === j.id && t.status !== "done");
  if (!j.cancelled && open.length && open.every(t => t.status === "waiting")) return "waiting";
  return j.status === "done" && open.length && !j.cancelled ? "working" : j.status;
}
const PH = {
  job: "무엇을 할까요?",
  claude: "Claude가 뭘 할까요?",
  codex: "Codex가 뭘 할까요?",
};
const HINT = {
  job: "Claude·Codex에게 맡깁니다 · Enter 보내기 · Shift+Enter 줄바꿈",
  claude: "Claude에게 맡깁니다 · Enter 보내기 · Shift+Enter 줄바꿈",

const grow = () => { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(Math.max(t.scrollHeight, 56), 200) + "px"; };
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
});
$("#newSession").onclick = () => api({action: "new_session"}).then(() => $("#input").focus());

function toast(text, undo) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${esc(text)}</span>` + (undo ? `<button class="toast-undo">되돌리기</button>` : "")
    + `<button class="toast-x" aria-label="알림 닫기" title="닫기">✕</button>`;
  if (undo) t.querySelector(".toast-undo").onclick = () => { t.remove(); undo(); };
  t.querySelector(".toast-x").onclick = () => { clearTimeout(toastTimer); t.remove(); };
  t.setAttribute("role", "status");
  t.style.bottom = (document.querySelector("footer")?.offsetHeight || 98) + 12 + "px";   // 입력창이 늘어나도 안 가리게
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 10000 : 6000);
}
function sessionAct(action, id) {
  if (action === "rename") {
    startRename(id);
  } else if (action === "pin") {
    const cur = window._sessions.find(x => x.id === id);
    if (cur) api({action, id, pinned: !cur.pinned});
  } else if (action === "delete") {
    const cur = window._sessions.find(x => x.id === id);
    if (cur?.open && !confirm(`이 대화에 진행 중인 요청 ${cur.open}건이 있습니다.\n휴지통으로 옮기면 작업이 멈춥니다. 옮길까요?`)) return;
    api({action, id}).then(ok => ok && toast("대화를 휴지통으로 옮겼습니다.", () => api({action: "restore", id})));
  } else if (action === "purge") {
    if (confirm("이 대화를 영구 삭제할까요?\n기록과 에이전트 세션이 모두 지워지며 되돌릴 수 없습니다.")) api({action, id});
  } else api({action, id});
}

// 대화 이름을 목록 그 자리에서 수정 (더블클릭 또는 연필). Enter 저장, Esc 취소. 수정 중엔 목록 다시 그리기 멈춤
let renaming = null;
function startRename(id) {
  const el = document.querySelector(`.sitem[data-id="${CSS.escape(id)}"] .stitle`);
  if (!el) return;
  const cur = window._sessions.find(x => x.id === id), inp = document.createElement("input");
  inp.className = "rename"; inp.value = cur?.title ?? ""; inp.setAttribute("aria-label", "대화 이름");
  renaming = id; el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true; renaming = null;
    const t = inp.value.trim();
    if (save && t && t !== cur?.title) api({action: "rename", id, title: t}); else { lastSess = ""; refresh(); }
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter" && !e.isComposing) finish(true); if (e.key === "Escape") finish(false); };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = () => finish(true);
}
// 설정 창: 화면 색·리소스 한도. 바깥을 누르거나 Esc로 닫음
function toggleSettings(force, restoreFocus = false) {
  const p = $("#settings"), open = force ?? p.hidden;
  p.hidden = !open;
  $("#settingsBtn").setAttribute("aria-expanded", String(open));
  if (open) {
    // 설정이 열려 있는 동안만 자동 알림을 보류한다. 읽음·오늘 숨김으로 기록하지 않는다.
    updatePanelOpen = false;
    reopenedUpdateKey = "";
    renderUpdate();
    $("#theme").focus({preventScroll: true});
  } else {
    renderUpdate();
    if (restoreFocus) $("#settingsBtn").focus({preventScroll: true});
  }
}
// 두 상단 팝업은 같은 규칙을 쓴다. 바깥 클릭은 누른 곳의 초점을 유지한다.
document.addEventListener("click", e => {
  const settingsWasOpen = !$("#settings").hidden, updateWasOpen = !$("#updateNotice").hidden;
  if (settingsWasOpen && !e.target.closest("#settings, #settingsBtn")) toggleSettings(false);
  if (updateWasOpen && !e.target.closest("#updateNotice, #version, #settingsBtn")) dismissUpdate(false, false);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#settings").hidden) { e.preventDefault(); toggleSettings(false, true); }
  else if (!$("#updateNotice").hidden) { e.preventDefault(); dismissUpdate(false); }
});
// 설정의 테마 버튼: 자동(OS 따라감) → 밝게 → 어둡게 순환, 이 PC에 기억
const THEMES = {auto: "◐ 자동", light: "☀ 밝게", dark: "☾ 어둡게"};
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const b = $("#theme");
  if (b) { b.textContent = THEMES[t] || THEMES.auto; b.removeAttribute("title"); }
}
function cycleTheme() {
  const order = ["auto", "light", "dark"], cur = localStorage.officeTheme || "auto";
  const next = order[(order.indexOf(cur) + 1) % 3];
  localStorage.officeTheme = next; applyTheme(next); themeTouched = Date.now();
  api({action: "ui_settings", theme: next});   // 서버에도 저장: 다시 켜서 주소(포트)가 바뀌어도 색 모드가 유지돼요
}
applyTheme(new URLSearchParams(location.search).get("theme") || localStorage.officeTheme);   // ?theme=는 캡처 점검용(저장 안 함)
function emptyTrash() {
  const n = window._sessions.filter(x => x.deleted).length;
  if (n && confirm(`휴지통의 대화 ${n}개를 모두 영구 삭제할까요?\n되돌릴 수 없습니다.`)) api({action: "empty_trash"});
}

// 키보드: 누를 수 있는 div(role=button)는 Enter/Space로 실행, Escape는 좁은 화면 서랍 닫기
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[role=button]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") document.body.classList.remove("show-sessions", "show-side");
});
// Edge 앱 창에서도 F5 / Ctrl+R 새로고침이 확실히 되게
document.addEventListener("keydown", e => {
  if (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r")) { e.preventDefault(); location.reload(); }
});

function ago(t) {
  const s = Math.floor(Date.now() / 1000 - t);
  if (s < 60) return "방금";
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  return new Date(t * 1000).toLocaleDateString("ko-KR", {month: "short", day: "numeric"});
}

// 대화 목록의 요청 상태: 서버가 status_counts/status_kind 를 주면 실제 상태별로, 없으면(구서버) 기존 '진행 중'
function sessionStatusHtml(x) {
  const ask = x.needs_user > 0 ? `<span class="live ask" title="사용자 확인을 기다리는 요청이 있어요">확인 필요 ${x.needs_user}</span>` : "";
  if (!x.open) return ask;
  const c = x.status_counts;
  if (!c) return ask + `<span class="live">진행 중 ${x.open}</span>`;
  const names = {working: "작업 중", waiting: "기다리는 중", planning: "계획 중", review: "확인 중"};
  const parts = ["working", "waiting", "planning", "review"].filter(k => c[k] > 0).map(k => `${names[k]} ${c[k]}`);
  const why = x.status_reason ? ` title="${esc(x.status_reason)}"` : "";
  // 기다리기만 하는 대화는 쉬는 대화(시각만 보임)와 한눈에 구분되게 보라색 칩 + 시계 아이콘
  const waiting = x.status_kind === "waiting";
  return ask + `<span class="live ${waiting ? "waiting" : ""}"${why}>${waiting ? icon("waiting", "sm") : ""}${esc(parts.join(" · ") || `진행 중 ${x.open}`)}</span>`;
}
function renderSessions(list, cur) {
  window._sessions = list;
  const live = list.filter(x => !x.deleted).sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned) || (a.pinned && b.pinned ? (a.pinned_at || 0) - (b.pinned_at || 0) || a.id.localeCompare(b.id) : b.updated - a.updated));
  const dead = list.filter(x => x.deleted).sort((a, b) => b.deleted_at - a.deleted_at);
  if (renaming) return false;   // 이름 고치는 중엔 입력칸이 사라지지 않게 다시 그리지 않음
  $("#slist").innerHTML = live.map(x => `<div class="sitem ${x.id === cur ? "on" : ""} ${x.unread ? "has-unread" : ""}"  data-id="${esc(x.id)}" role="button" tabindex="0" onclick='sessionAct("switch","${esc(x.id)}")'>
      <div class="sm-meta"><div class="stitle-row"><div class="stitle" title="${esc(x.title)} · 두 번 눌러 이름 바꾸기" ondblclick='event.stopPropagation();startRename("${esc(x.id)}")'>${esc(x.title)}</div>${x.pinned ? `<span class="pin-mark" role="img" aria-label="고정된 대화" title="고정된 대화">${icon("pin", "sm")}</span>` : ""}</div>
        <div class="ssub">${x.stopped ? `<span class="stop" >⚠ 멈춤</span>` : ""}${x.busy ? `<span class="dot working" style="background:var(--ok)"></span>` : ""}${sessionStatusHtml(x)}<span>${ago(x.updated)}</span></div></div>
      <div class="acts" onclick="event.stopPropagation()">
        <button class="ghost" title="${x.pinned ? "고정 해제" : "맨 위에 고정"}" aria-label="${x.pinned ? "고정 해제" : "맨 위에 고정"}" aria-pressed="${!!x.pinned}" onclick='sessionAct("pin","${x.id}")'>${icon("pin", "sm")}</button>
        <button class="ghost" title="이름 바꾸기" aria-label="이름 바꾸기" onclick='sessionAct("rename","${x.id}")'>${icon("edit", "sm")}</button>
        <button class="ghost" title="삭제" aria-label="삭제" onclick='sessionAct("delete","${x.id}")'>${icon("trash", "sm")}</button></div>
    </div>`).join("");
  $("#trashLabel").textContent = dead.length ? `휴지통 (${dead.length})` : "휴지통";
  $("#emptyTrash").hidden = !dead.length;
  const curTitle = list.find(x => x.id === cur)?.title;
  document.title = curTitle && curTitle !== "새 대화" ? `${curTitle} — Office` : "Office";
  $("#tlist").innerHTML = dead.map(x => `<div class="sitem">
      <div class="sm-meta"><div class="stitle" title="${esc(x.title)}">${esc(x.title)}</div><div class="ssub">${ago(x.deleted_at)} 삭제</div></div>
      <div class="acts">
        <button class="ghost txt" onclick='sessionAct("restore","${x.id}")'>복원</button>
        <button class="ghost txt danger" onclick='sessionAct("purge","${x.id}")'>완전 삭제</button></div>
    </div>`).join("") || '<div class="empty">비어 있습니다.</div>';
}

$("#quit").onclick = () => {
  if (!confirm("Office를 종료할까요?\n진행 중인 작업은 중단됩니다.")) return;
  api({action: "quit"}).then(ok => {
    if (ok) clearInterval(refreshTimer);
    if (ok) { document.body.innerHTML = "<p style='padding:32px;color:var(--muted)'>Office가 종료되었습니다. 이 창은 닫아도 됩니다.</p>"; window.close(); }
  });
};

// 메시지 시각: 오늘이면 지금처럼 시:분:초, 아니면 '어제 23:50' · '10월 13일 23:50' · '2025년 10월 13일'
// 예전 메시지에는 날짜(at)가 없어서, 요청 시작 시각을 기준으로 시각이 거꾸로 가면 하루씩 넘기며 날짜를 추정한다
function stampMsgs(msgs, jobs) {
  const start = Object.fromEntries((jobs || []).filter(j => j.started_at).map(j => [j.id, j.started_at]));
  const dayOf = t => { const d = new Date(t * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; };
  const secOf = ts => /^\d{2}:\d{2}:\d{2}$/.test(ts || "") ? ts.split(":").reduce((a, x) => a * 60 + +x, 0) : null;
  let day = null, prev = null;
  for (const m of msgs) {
    const sec = secOf(m.ts);
    if (typeof m.at === "number") { m._at = m.at; day = dayOf(m.at); prev = sec; continue; }
    // 요청이 바뀌면 그 요청의 시작 날짜로 다시 맞춘다 (날짜는 앞으로만 감: 기록은 시간 순)
    const jd = start[m.job] ? dayOf(start[m.job]) : null;
    if (jd != null && (day == null || jd > day)) { day = jd; prev = null; }
    if (day == null || sec == null) continue;
    if (prev != null && sec < prev - 60) day += 86400;   // 시각이 거꾸로 가면 자정을 넘긴 것
    m._at = day + sec; prev = sec;
  }
}
function when(m) {
  if (!m?._at) return m?.ts || "";
  const d = new Date(m._at * 1000), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (d.toDateString() === now.toDateString()) return m.ts || hm;
  if (d.toDateString() === y.toDateString()) return `어제 ${hm}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일 ${hm}`;
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function elapsed(t) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  return s < 60 ? `${s}초` : s < 3600 ? `${Math.floor(s / 60)}분` : `${Math.floor(s / 3600)}시간`;
}
// 대화창 바닥 진행 줄용: 매초 바뀌게 초까지 (1분 넘어가도 '1분 23초', 1시간 넘으면 '1시간 5분')
function elapsedLive(t) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  return s < 60 ? `${s}초` : s < 3600 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${Math.floor(s / 3600)}시간 ${Math.floor(s % 3600 / 60)}분`;
}

function fmtTok(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n || 0); }
function resetIn(t) {
  if (!t) return "";
  const m = Math.max(0, Math.round((t * 1000 - Date.now()) / 60000));
  return m < 60 ? `${m}분 후 초기화` : m < 1440 ? `${Math.floor(m / 60)}시간 ${m % 60}분 후 초기화` : `${Math.floor(m / 1440)}일 ${Math.floor(m % 1440 / 60)}시간 후 초기화`;
}
function usageBlock(n, a) {
  const L = a.limits || {};
  const rows = [["five_hour", "5시간"], ["seven_day", "7일"]].filter(([k]) => L[k]).map(([k, lbl]) => {
    const u = L[k].used, col = u >= 90 ? "var(--warn)" : `var(--${n})`;
    return `<div class="u" title="${resetIn(L[k].resets)}"><span>${lbl}</span><div class="bar"><i style="width:${Math.min(u, 100)}%;background:${col}"></i></div><span class="pct">${u}%</span></div>`;
  }).join("");
  const asof = L.at ? `<div class="tok"><span>한도 기준</span><span>${ago(L.at)}</span></div>` : "";
  return `<div class="usage">${rows ? rows + asof : '<div>사용 한도 정보 아직 없음</div>'}
    ${a.usage_since != null
      ? `<div class="tok" title="${ago(a.usage_since)}부터 · 캐시 ${fmtTok(a.cached_tokens)} 제외"><span>이 대화에서 쓴 양</span><span>${fmtTok(a.tokens)} tokens</span></div>`
      : `<div class="tok" title="에이전트별 집계 기준이 달라요"><span>이 대화에서 쓴 양 (예전 기준)</span><span>${fmtTok(a.tokens)} tokens</span></div>`}</div>`;
}

// 활동 피드엔 사용자가 볼 것만: 차례 시작, 고친 파일, 작업판/메신저 동작. 읽기·검색·일반 명령·중간 독백은 횟수만
const OFFICE_ACT = {
  claim: r => `작업 #${r.split(/\s/)[0]} 시작`,
  done: r => `작업 #${r.split(/\s/)[0]} 완료`,
  handoff: r => { const m = r.match(/^(\S+).*?--to\s+(\S+)/); return m ? `작업 #${m[1]} → ${NAME[m[2]] ?? m[2]}에게 넘김` : "작업 넘김"; },
  say: r => { const m = r.match(/--to\s+(\S+)/); return m ? `${NAME[m[1]] ?? m[1]}에게 메시지` : "메시지"; },
  add: r => { const m = r.match(/--to\s+(\S+)/); return m ? `작업 추가 → ${NAME[m[1]] ?? m[1]}` : "작업 추가"; },
  finish: () => "최종 보고",
  title: () => "대화 제목 갱신",
};
function feedRows(activity) {
  // 일반 읽기·명령은 횟수로 접되 가장 최근 것 한 줄은 보여줌 (일하는 동안 카드 맨 아래 줄이 명령마다 바뀌게)
  // 접힌 줄을 누르면 그 묶음의 명령 목록이 펼쳐짐 (Codex는 활동 대부분이 명령이라 접기만 하면 상세가 안 보였음)
  const out = []; let tools = [], lastEdit = "";
  const one = t => esc(t.replace(/^\$ /, "").split("\n")[0].slice(0, 160));
  const flush = () => {
    if (!tools.length) return;
    const key = tools[0].ts + "|" + tools[0].text.slice(0, 60), last = tools.at(-1).text;
    out.push(`<details class="row more" data-more="${esc(key)}" ${openMore.has(key) ? "open" : ""}><summary><span class="tx">명령 기록 ${tools.length}건 ·<span class="last">${one(last)}</span></span></summary>
      <div class="cmds">${tools.map(t => `<div class="cmd" title="${esc(t.text)}"><span class="ts">${esc(t.ts || "")}</span><code>${one(t.text)}</code></div>`).join("")}</div></details>`);
    tools = [];
  };
  for (const x of activity) {
    if (x.kind === "end") { flush(); lastEdit = ""; out.push(`<div class="sep"></div>`); continue; }
    if (x.kind === "start") { out.push(`<div class="row start">${icon("start", "sm")}<span class="tx">${esc((([k, j]) => DOING[k]?.(j) ?? k)(x.text.split("|")))}</span><span class="ts">${x.ts}</span></div>`); continue; }
    if (x.kind === "edit") {
      const f = x.text.replace(/^(Edit|Write|MultiEdit): /, "");
      if (f !== lastEdit) out.push(`<div class="row edit" title="${esc(f)}">${icon("edit", "sm")}<span class="tx">${esc(f)}</span></div>`);
      lastEdit = f; continue;
    }
    const m = x.kind === "tool" && x.text.match(/\boffice\s+(claim|done|handoff|say|add|finish|title)\b\s*(.*)/s);
    if (m) out.push(`<div class="row tool">${icon("tool", "sm")}<span class="tx">${esc(OFFICE_ACT[m[1]](m[2].replace(/^["']|["']$/g, "")))}</span></div>`);
    else if (x.kind === "tool") tools.push(x);
    else if (x.kind === "text" && x.text.trim()) {   // 에이전트가 중간에 한 말 (최종 답 포함) — 첫 줄만
      flush();
      out.push(`<div class="row say" title="${esc(x.text)}"><span class="tx">${esc(x.text.trim().split("\n")[0].slice(0, 200))}</span></div>`);
    }
  }
  flush();
  return out;
}

// 오류 종류별 사람 말 안내 (서버 agents.<n>.error_kind). 카드·진행 줄이 같은 문구를 씀
const KIND_HELP = {

      if (x.type !== type) { if (type) html += `</${type}>`; type = x.type; html += `<${type} class="md-list">`; }

// 요청현황용 한 줄 요약: 서버가 준 brief → 없으면 보고 첫 줄

// 끝난 요청의 오래된 작업 기록은 서버가 따로 옮겨 두고 앞부분만 보내요. 펼칠 때 전체를 불러와요.
const archivedTurns = new Map();
const archivedKey = (session, id) => `${session || ""}:${id}`;   // 대화마다 메시지 번호가 겹쳐서 대화와 번호를 함께 씀

  return archivedTurns.has(key) ? `<pre>${esc(archivedTurns.get(key))}</pre>`
    : `<pre data-archived-turn="${m.id}" data-session="${esc(session)}">${esc(m.text)}</pre><p class="archived-note">전체 기록을 불러오는 중이에요.</p>`;

// 같은 표시를 매초 다시 만들지 않아 선택한 글자와 펼친 내용을 유지해요.

// 사용자 알림의 링크는 먼저 HTML 문자를 이스케이프한 뒤 https 주소만 링크로 만든다.

  url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);

const readNote = m => m.from === "user" && Number.isFinite(m.id) && m.at

// 대화창을 요청 단위로 묶음: 요청 → (진행 과정은 접어둠) → 결과 보고
// 메시지에 job이 없으면(예전 기록) 요청 순서·"요청 N" 이벤트로 추정
function threads(msgs, jobs) {
  const items = [], byJob = {};
  let reqN = 0, cur = null, chat = false;   // chat: 직전 요청 뒤에 단독 대화(사용자 직접 메시지)가 시작됐는지
  for (let m of msgs) {

    const direct = m.from === "user" && m.kind === "msg" && m.to !== "all";
    let j = direct ? null : m.job;
    if (m.kind === "request") { j ??= jobs[reqN]?.id; reqN++; }
    j ??= +(m.kind === "event" && m.text.match(/^요청 (\d+) /)?.[1]) || null;
    // 직전 요청에 붙이는 추정은 job 필드 자체가 없는 예전 기록만. 명시적 job:null은 단독 대화로 둔다
    if (j == null && !("job" in m) && !(m.from === "user" && m.kind === "msg") && m.kind !== "turn") j = cur;
    // 요청이 끝난 뒤 남은 뒷정리(재시작으로 다시 돈 차례의 안내·에이전트끼리 메시지·혼잣말)는 단독 대화가 아니면 직전 요청 진행 과정으로 접음
    if (j == null && cur != null && !chat && m.from !== "user" && m.re == null && m.kind !== "request") { j = cur; m = {...m, tail: true}; }
    if (m.kind === "request") { cur = j; chat = false; }
    if (direct) chat = true;
    if (j == null) { items.push({m}); continue; }
    if (!byJob[j]) items.push(byJob[j] = {job: jobs.find(x => x.id === j) || {id: j}, req: null, steps: [], reports: []});
    const t = byJob[j];
    if (m.kind === "request" && !t.req) t.req = m;
    else if (m.tail) t.steps.push(m);
    else if (m.kind === "report" || (m.kind === "msg" && m.from !== "user" && m.to === "user") || (m.kind === "event" && m.to === "user")) t.reports.push(m);

  const replies = items.filter(x => x.m?.re != null && items.some(y => y.m && y.m.id === x.m.re && y.m.from === "user"));

  }

}

// 시간순 보기: 요청은 보낸 자리, 답(결과 보고)은 실제로 온 자리에 둔다.
// 요청과 답 사이에 다른 대화가 끼면 묶음을 '요청'과 '답'으로 나눠 각자 자리에 두고, 서로 눌러 오가게 한다.
// 사이에 낀 게 없으면 지금처럼 한 묶음. 진행 중인 요청의 진행 상황은 맨 아래에 요청 순서대로 둔다.

  const split = new Set();

// 답 쪽 맨 위 인용 줄: 어느 요청의 답인지 보여 주고 누르면 그 요청으로 이동
const quoteHtml = (j, req, ids, what) => `<div class="re-quote" role="button" tabindex="0" title="요청으로 이동" onclick="jumpTo(${j.id})"><b>요청 ${ids.join("·")} ${what}</b>${req ? `<span>· ${esc(firstLine(req.text))}</span>` : ""}</div>`;
const RECENT_LIVE = 3;   // 진행 중 요청에서 바로 보이는 최근 안내 수
function threadHtml(t, part = "full") {
  if (part === "more") return `<div class="thread tail">${quoteHtml(t.job, t.req, [t.job.id], "답")}${msgHtml(t.more)}</div>`;
  // 지나간 경고(예: 'Codex 일시정지')는 그 에이전트가 이후에 다시 움직였으면 해결된 것 → 결과 자리에서 빼서 진행 과정으로 접음
  const all = [...t.steps, ...t.reports];

  // 중간 설명(질문 답장이 아닌 일반 메시지)은 최신 한 건만 본문에 두고 지난 것은 진행 과정에 접음. 최종 보고·경고·질문 답장은 그대로
  // 진행 중인 요청은 진행 알림과 중간 설명을 합쳐 최근 3건을 밖에 두어 '진짜 진행되는 느낌'을 주고, 끝난 요청은 최신 한 건만 둠

  const recent = live ? [...t.steps.filter(m => m.kind === "progress"), ...plainMsgs].sort((x, y) => x.id - y.id).slice(-RECENT_LIVE) : [];

// 리소스 한도: 새로 시작하는 작업부터 적용. 입력 중엔 다시 그리지 않음
let lastResSig = "";
